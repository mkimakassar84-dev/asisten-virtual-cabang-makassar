<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asisten Virtual Cabang Makassar</title>
<meta name="description" content="Tanya jawab data kinerja & KPI Cabang Makassar">
<meta name="theme-color" content="#9c2b2e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Asisten Makassar">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="app-header-title">
    <img src="logo-mki-makassar.jpg" alt="Logo Tim MKI Makassar" class="app-logo" onerror="this.remove()">
    <div>
      <h1>Asisten Virtual</h1>
      <span>Cabang Makassar</span>
    </div>
  </div>
  <button id="refreshBtn" class="icon-btn" title="Refresh Data" aria-label="Refresh Data">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0012 4a8 8 0 108 8h-2a6 6 0 11-1.76-4.24L13 11h7V4l-2.35 2.35z"/></svg>
  </button>
</header>

<div id="statusBar" class="status-bar">Memuat data...</div>

<main id="chatLog" class="chat-log" aria-live="polite"></main>

<form id="composer" class="composer">
  <button type="button" id="micBtn" class="icon-btn mic-btn" title="Rekam suara" aria-label="Rekam suara">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 14a3 3 0 003-3V6a3 3 0 00-6 0v5a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.92V21h2v-3.08A7 7 0 0019 11h-2z"/></svg>
  </button>
  <input type="text" id="textInput" placeholder="Tanya soal penjualan, revenue, piutang, stok..." autocomplete="off">
  <button type="submit" id="sendBtn" class="icon-btn send-btn" title="Kirim" aria-label="Kirim">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
  </button>
</form>

<script src="data-loader.js"></script>
<script src="intents.js"></script>
<script src="app.js"></script>
</body>
</html>
